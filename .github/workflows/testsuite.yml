name: Test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - collection2: '4.0.4'
            schema: '1.13.1'
          - collection2: '4.2.2'
            schema: '2.0.0'
          - collection2: '5.0.0'
            schema: '3.0.0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Meteor
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: '3.5.3'
      - name: Install test dependencies
        working-directory: tests
        run: meteor npm ci
      - name: Select compatibility versions
        working-directory: tests
        env:
          METEOR_PACKAGE_DIRS: ../package
        run: meteor add 'aldeed:collection2@=${{ matrix.collection2 }}' 'aldeed:simple-schema@=${{ matrix.schema }}' --allow-incompatible-update
      - name: Test server and client
        working-directory: tests
        run: meteor npm test
